<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hayden C. Blodgett - Academic Portfolio</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #202124;
        }
        #adobe-dc-view {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="adobe-dc-view"></div>

    <script src="https://documentservices.adobe.com/view-sdk/v1/index.js"></script>
    <script type="text/javascript">
        document.addEventListener("adobe_dc_view_sdk.ready", function(){ 
            var adobeDCView = new AdobeDC.View({
                /* This free client ID works perfectly for anyone hosting on github.io links */
                clientId: "986a5390639e45fb8b29d4eff643cfcd", 
                divId: "adobe-dc-view"
            });
            adobeDCView.previewFile({
                content: { location: { url: "HaydenCBlodgett-Academic-Portfolio-2026.pdf" }},
                metaData: { fileName: "Hayden C. Blodgett - Academic Portfolio" }
            }, {
                /* FORCE SPREAD VIEW: This locks the default browser view to booklet spreads */
                defaultViewMode: "TWO_PAGE", 
                showAnnotationTools: false,
                showLeftHandPanel: false
            });
        });
    </script>

</body>
</html>
