<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hayden C. Blodgett | Architecture Portfolio</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #003057;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e0e0e0;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 500px;
            width: 90%;
        }
        .name {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 3px;
            color: #ffffff;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .title {
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 2px;
            color: #a0a0a0;
            margin-bottom: 40px;
            text-transform: uppercase;
        }
        .portfolio-btn {
            display: inline-block;
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            text-decoration: none;
            padding: 14px 32px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .portfolio-btn:hover {
            background-color: #ffffff;
            color: #121212;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="name">Hayden C. Blodgett</div>
        <div class="title">Graduate Architecture Portfolio</div>
        
        <!-- This link bypasses all iframe blocks and loads perfectly across all web browsers -->
        <a class="portfolio-btn" href="https://github.com/haydenblodgett-ops/Academic-Portfolio/releases/download/v1.0/HaydenCBlodgett-Academic-Portfolio-2026.pdf" target="_blank">
            View Portfolio
        </a>

        <div class="title">Contact: 
            <a href="hblodgett@tulane.edu"> hblodgett@tulane.edu </a>
        </div>
        
    </div>

</body>
</html>
